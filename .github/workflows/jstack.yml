name: jstack
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  workflow_run:
    workflows:
      - "**"
      - "!jstack"
    types:
      - completed
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
jobs:
  jstack:
    runs-on: ubuntu-24.04
    environment: jstack
    timeout-minutes: 15
    steps:
      - name: Mint the product's token
        id: product
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.JSTACK_APP_CLIENT_ID }}
          private-key: ${{ secrets.JSTACK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-issues: read
          permission-pull-requests: write
          permission-statuses: read
      - name: Read the jstack version main pins
        id: pin
        env:
          GH_TOKEN: ${{ steps.product.outputs.token }}
        run: |
          set -euo pipefail
          curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/.agents/settings.json?ref=main" \
            | jq -r .content | base64 -d > "$RUNNER_TEMP/settings.json"
          echo "version=$(jq -r '.jstack.version // ""' "$RUNNER_TEMP/settings.json")" >> "$GITHUB_OUTPUT"
      - name: Mint the token that reads jstack's releases
        id: jstack
        if: steps.pin.outputs.version != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.JSTACK_APP_CLIENT_ID }}
          private-key: ${{ secrets.JSTACK_APP_PRIVATE_KEY }}
          owner: SideQuesst
          repositories: jstack
          permission-contents: read
      - name: Fetch the pinned jstack, check it, and run its checks
        env:
          GH_TOKEN: ${{ steps.product.outputs.token }}
          JSTACK_TOKEN: ${{ steps.jstack.outputs.token }}
          APP_SLUG: ${{ steps.product.outputs.app-slug }}
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/settings.json"
          api() { curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          refuse() {
            local summary="$1" fact="$2" head name
            local heads
            heads=$(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" | jq -r '.[].head.sha')
            local only
            only=$(jq -r '.pull_request.head.sha // .workflow_run.head_sha // ""' "$GITHUB_EVENT_PATH")
            for head in $heads; do
              if [ -n "$only" ] && [ "$head" != "$only" ]; then continue; fi
              {
                jq -r '(.required_checks // {}) | to_entries[] | select(.value.producer.app == "jstack") | .key' "$settings"
                api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$head/check-runs?filter=all&per_page=100" \
                  | jq -r --arg slug "$APP_SLUG" '.check_runs[] | select(.app.slug == $slug) | .name'
              } | sort -u | while IFS= read -r name; do
                jq -cn --arg name "$name" --arg head "$head" --arg summary "$summary" --argjson fact "$fact" \
                  '{name: $name, head_sha: $head, status: "completed", conclusion: "failure",
                    output: {title: ($name + ": failed"), summary: $summary, text: ({facts: [$fact]} | tojson)}}' \
                  | api -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/check-runs" -d @- > /dev/null
              done
            done
            echo "$summary" >&2
            exit 1
          }
          version=$(jq -r '.jstack.version // ""' "$settings")
          pinned=$(jq -r '.jstack.checksum // ""' "$settings")
          if [ -z "$version" ] || [ -z "$pinned" ]; then
            refuse "main's .agents/settings.json pins no jstack version, so no jstack check ran" \
              '{"kind": "no-version", "rule": "PIPE-021", "fix": {"needs": "owner"}}'
          fi
          release="$RUNNER_TEMP/jstack-release"
          mkdir -p "$release"
          program=jstack-linux-amd64
          archive="jstack-$version.tar"
          missing() {
            refuse "jstack $version publishes no $1 that this job could fetch, so nothing from it ran" \
              "$(jq -n --arg version "$version" --arg file "$1" \
                '{kind: "release-missing", version: $version, file: $file, rule: "MERGE-035", fix: {needs: "owner"}}')"
          }
          if ! assets=$(curl -sSf -H "Authorization: Bearer $JSTACK_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/SideQuesst/jstack/releases/tags/v$version"); then
            missing "release v$version"
          fi
          for file in checksums.txt "$program" "$archive"; do
            id=$(jq -r --arg file "$file" '.assets[] | select(.name == $file) | .id' <<< "$assets")
            if [ -z "$id" ] || ! curl -sSfL -H "Authorization: Bearer $JSTACK_TOKEN" -H "Accept: application/octet-stream" \
              -o "$release/$file" "$GITHUB_API_URL/repos/SideQuesst/jstack/releases/assets/$id"; then
              missing "$file"
            fi
          done
          published="sha256:$(sha256sum "$release/checksums.txt" | cut -d' ' -f1)"
          if [ "$published" != "$pinned" ]; then
            refuse "main pins jstack $version as $pinned, but its published checksums file is $published, so nothing from it ran" \
              "$(jq -n --arg version "$version" --arg pinned "$pinned" --arg published "$published" \
                '{kind: "release-refused", version: $version, pinned: $pinned, published: $published, rule: "MERGE-035", fix: {needs: "owner"}}')"
          fi
          for file in "$program" "$archive"; do
            listed=$(awk -v file="$file" '$2 == file { print $1 }' "$release/checksums.txt")
            if [ "$listed" != "$(sha256sum "$release/$file" | cut -d' ' -f1)" ]; then
              refuse "$file of jstack $version is not the file its checksums file lists, so nothing from it ran" \
                "$(jq -n --arg version "$version" --arg file "$file" \
                  '{kind: "release-unlisted", version: $version, file: $file, rule: "MERGE-035", fix: {needs: "owner"}}')"
            fi
          done
          chmod +x "$release/$program"
          JSTACK_RELEASES="$release" JSTACK_GITHUB_TOKEN="$GH_TOKEN" \
            "$release/$program" on "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"
